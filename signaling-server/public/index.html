<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi WebRTC Video</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101418;
      color: #eef4f8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(180px, 1fr) auto auto;
      background: #101418;
    }

    header,
    footer {
      padding: 12px 14px;
      background: #1a2229;
      border-color: #2c3943;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2c3943;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }

    .status {
      font-size: 13px;
      color: #9ed7ff;
      overflow-wrap: anywhere;
    }

    main {
      display: grid;
      place-items: center;
      padding: 12px;
      overflow: hidden;
    }

    img {
      display: block;
      width: 100%;
      max-width: 1280px;
      max-height: max(180px, calc(100vh - 240px));
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #06080a;
      border: 1px solid #26333d;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid #2c3943;
      font-size: 12px;
      color: #b9c7d0;
    }

    .latency-bar {
      padding: 12px 14px;
      border-top: 1px solid #2c3943;
      background: #151b20;
    }

    .latency-heading {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: #b9c7d0;
      font-size: 12px;
    }

    .latency-heading h2 { margin: 0; font-size: 12px; font-weight: 500; }
    #latency-state { color: #81dbc1; }
    .latency-metrics { margin: 12px 0 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
    .latency-metrics dt { color: #b9c7d0; font-size: 12px; margin-bottom: 4px; }
    .latency-metrics dd { margin: 0; font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    #latency-age[data-stalled="true"] { color: #ffbe7d; }
    @media (max-width: 700px) { .latency-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <header>
    <h1>Pi WebRTC Video</h1>
    <div class="status" id="status">connecting</div>
  </header>

  <main>
    <img id="video" alt="video stream">
  </main>

  <section class="latency-bar" aria-label="JPEG 链路延迟">
    <div class="latency-heading">
      <h2 title="JPEG 写入共享内存到浏览器解码完成；不包含摄像头内部采集、编码和显示器刷新">JPEG 输出 → 解码</h2>
      <span id="latency-state">校准中</span>
    </div>
    <dl class="latency-metrics">
      <div><dt>当前帧延迟</dt><dd id="latency-current">-- ms</dd></div>
      <div><dt>画面年龄</dt><dd id="latency-age">-- ms</dd></div>
      <div><dt>近 10 秒平均</dt><dd id="latency-mean">-- ms</dd></div>
      <div><dt>P95 / 10 秒</dt><dd id="latency-p95">-- ms</dd></div>
      <div><dt>时钟误差估计</dt><dd id="latency-error">-- ms</dd></div>
    </dl>
  </section>

  <footer>
    <span id="frames">0 frames</span>
    <span id="stats">0.0 fps | 0.00 Mbps</span>
    <span id="bytes">0 KB</span>
    <span id="drops">丢弃 0 帧</span>
  </footer>

  <script src="/latency.js?v=20261008"></script>
  <script src="/video-frames.js?v=20261008"></script>
  <script>
    const MAGIC = 0x56504631;
    const wsUrl = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/?role=viewer&v=20260607b`;
    const statusEl = document.getElementById('status');
    const frameEl = document.getElementById('frames');
    const bytesEl = document.getElementById('bytes');
    const statsEl = document.getElementById('stats');
    const videoEl = document.getElementById('video');
    const dropsEl = document.getElementById('drops');
    const latency = new VideoLatency.LatencyTracker();
    const latencyEls = Object.fromEntries(['current', 'age', 'mean', 'p95', 'error', 'state'].map(name => [name, document.getElementById(`latency-${name}`)]));
    let latencyGeneration = 0;
    let nextClockProbe = 0;
    let lastVideoReceived = 0;

    function updateLatency() {
      const sample = latency.snapshot();
      const format = value => Number.isFinite(value) ? `${Math.round(value)} ms` : '-- ms';
      latencyEls.current.textContent = format(sample.delayMs);
      latencyEls.age.textContent = format(sample.ageMs);
      latencyEls.mean.textContent = format(sample.meanMs);
      latencyEls.p95.textContent = format(sample.p95Ms);
      latencyEls.error.textContent = Number.isFinite(sample.uncertaintyMs) ? `±${Math.ceil(sample.uncertaintyMs)} ms` : '-- ms';
      const labels = { calibrating: '校准中', stale: '校准失效', waiting: '等待帧时间', invalid: '时钟精度不足', ready: `10 秒内 ${sample.count} 帧` };
      latencyEls.state.textContent = document.hidden ? '后台标签页' : labels[sample.state];
      latencyEls.age.dataset.stalled = String(lastVideoReceived > 0 && performance.now() - lastVideoReceived > 1000);
      dropsEl.textContent = `丢弃 ${assembler.dropped} 帧`;
    }

    function resetLatency() {
      latencyGeneration++;
      latency.reset();
      nextClockProbe = 0;
      lastVideoReceived = 0;
      updateLatency();
    }

    let pc;
    let ws;
    let controlChannel;
    let videoChannel;
    let lastObjectUrl;
    let frameCount = 0;
    let byteCount = 0;
    let statsStart = performance.now();
    let statsFrames = 0;
    let statsBytes = 0;
    let signalQueue = Promise.resolve();
    const pendingCandidates = [];
    const assembler = new VideoFrames.Assembler();
    const frames = assembler.frames;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function ensureFrame(frameId, totalFragments, totalBytes) {
      return assembler.ensureFrame(frameId, totalFragments, totalBytes);
    }

    function pruneFrames() {
      assembler.prune();
    }

    function renderFrame(frameId) {
      const frame = frames.get(frameId);
      if (!frame || frame.received !== frame.totalFragments) {
        return;
      }
      if (!assembler.finish(frameId)) return;

      const blob = new Blob(frame.chunks, { type: 'image/jpeg' });
      const url = URL.createObjectURL(blob);
      videoEl.src = url;
      if (lastObjectUrl) {
        URL.revokeObjectURL(lastObjectUrl);
      }
      lastObjectUrl = url;
      const generation = latencyGeneration;
      videoEl.decode().then(() => {
        if (generation !== latencyGeneration || videoEl.src !== url) return;
        lastVideoReceived = performance.now();
        latency.noteDecoded(frameId, lastVideoReceived);
        recordRenderedFrame(frameId, frame);
        updateLatency();
      }).catch(() => {});
    }

    function recordRenderedFrame(frameId, frame) {
      frameCount += 1;
      byteCount += frame.receivedBytes;
      statsFrames += 1;
      statsBytes += frame.receivedBytes;
      frameEl.textContent = `${frameCount} frames`;
      bytesEl.textContent = `${Math.round(byteCount / 1024)} KB`;
      const elapsed = (performance.now() - statsStart) / 1000;
      if (elapsed >= 1) {
        const fps = statsFrames / elapsed;
        const mbps = (statsBytes * 8) / elapsed / 1024 / 1024;
        statsEl.textContent = `${fps.toFixed(1)} fps | ${mbps.toFixed(2)} Mbps`;
        statsStart = performance.now();
        statsFrames = 0;
        statsBytes = 0;
      }
      setStatus(`streaming ${frameId}`);
    }

    function handleControlMessage(text) {
      const msg = JSON.parse(text);
      if (msg.type === 'latency_clock_response') {
        latency.acceptClock(msg);
        updateLatency();
        return;
      } else if (msg.type === 'frame_start') {
        latency.noteMetadata(msg.frame_id, msg.published_steady_ms);
        ensureFrame(msg.frame_id, msg.total_fragments, msg.total_bytes || 0);
      } else if (msg.type === 'frame_end') {
        renderFrame(msg.frame_id);
      } else if (msg.type === 'skip_frame') {
        if (frameCount === 0) {
          setStatus(`waiting frame ${msg.frame_id}`);
        }
      }
      pruneFrames();
    }

    async function handleVideoMessage(data) {
      const buffer = data instanceof ArrayBuffer ? data : await data.arrayBuffer();
      const packet = VideoFrames.parseFragment(buffer);
      const frame = assembler.accept(packet);
      if (!frame) return;
      if (frame.received === 1 && frame.published) latency.noteMetadata(packet.id, frame.published);

      if (frame.received === frame.totalFragments) {
        renderFrame(packet.id);
      }
      pruneFrames();
    }

    function closePeerConnection() {
      if (pc) {
        pc.onicecandidate = null;
        pc.onconnectionstatechange = null;
        pc.ondatachannel = null;
        pc.close();
      }
      pc = null;
      controlChannel = null;
      videoChannel = null;
      pendingCandidates.length = 0;
      assembler.reset();
      resetLatency();
    }

    function setupPeerConnection() {
      pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
      });

      pc.onicecandidate = ({ candidate }) => {
        if (candidate && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            candidate: candidate.candidate,
            sdpMid: candidate.sdpMid,
            sdpMLineIndex: candidate.sdpMLineIndex,
          }));
        }
      };

      pc.onconnectionstatechange = () => {
        setStatus(pc.connectionState);
        if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) resetLatency();
      };

      pc.ondatachannel = ({ channel }) => {
        channel.binaryType = 'arraybuffer';
        if (channel.label === 'control') {
          controlChannel = channel;
          controlChannel.onmessage = (event) => handleControlMessage(event.data);
        } else if (channel.label === 'video') {
          videoChannel = channel;
          videoChannel.onmessage = (event) => handleVideoMessage(event.data);
        }
        channel.onopen = () => setStatus(`${channel.label} open`);
        channel.onclose = () => {
          setStatus(`${channel.label} closed`);
          resetLatency();
        };
      };
    }

    function normalizeCandidate(msg) {
      let candidate = msg.candidate || '';
      if (candidate.startsWith('a=candidate:')) {
        candidate = candidate.substring(2);
      }
      return {
        candidate,
        sdpMid: msg.sdpMid || '0',
        sdpMLineIndex: msg.sdpMLineIndex ?? 0,
      };
    }

    async function addRemoteCandidate(msg) {
      const candidate = normalizeCandidate(msg);
      if (!pc.remoteDescription) {
        pendingCandidates.push(candidate);
        return;
      }
      await pc.addIceCandidate(candidate);
    }

    async function flushPendingCandidates() {
      while (pendingCandidates.length > 0 && pc.remoteDescription) {
        await pc.addIceCandidate(pendingCandidates.shift());
      }
    }

    async function handleSignal(text) {
      const msg = JSON.parse(text);
      if (msg.type === 'server_warning') {
        setStatus(msg.message || 'server warning');
        return;
      }
      if (msg.type === 'offer' && msg.sdp) {
        if (pc.remoteDescription || pc.signalingState !== 'stable') {
          closePeerConnection();
          setupPeerConnection();
        }
        await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
        await flushPendingCandidates();
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
      } else if (msg.type === 'answer' && msg.sdp) {
        await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
        await flushPendingCandidates();
      } else if (msg.candidate) {
        await addRemoteCandidate(msg);
      }
    }

    function connect() {
      closePeerConnection();
      signalQueue = Promise.resolve();
      setupPeerConnection();
      ws = new WebSocket(wsUrl);
      ws.onopen = () => setStatus('signaling open');
      ws.onmessage = (event) => {
        signalQueue = signalQueue.then(() => handleSignal(event.data)).catch((error) => {
          console.error(error);
          setStatus('signal error');
        });
      };
      ws.onclose = () => {
        setStatus('signaling closed');
        closePeerConnection();
      };
      ws.onerror = () => setStatus('ws error');
    }

    setInterval(() => {
      updateLatency();
      if (!controlChannel || controlChannel.readyState !== 'open' || performance.now() < nextClockProbe) return;
      const request = latency.request();
      nextClockProbe = performance.now() + (latency.clocks.length < 8 ? 250 : 1000);
      try { controlChannel.send(JSON.stringify(request)); }
      catch (error) { latency.cancelRequest(request.request_id); }
    }, 100);

    connect();
  </script>
</body>
</html>
