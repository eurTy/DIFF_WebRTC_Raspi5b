name: semantic-adaptive-v2
services:
  stream:
    build: .
    image: semantic-adaptive-v2:local
    ports:
      - "8088:8088"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cpus: 1.0
    pids_limit: 64
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
